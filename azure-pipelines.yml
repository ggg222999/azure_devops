# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- main

pool:
  vmImage: ubuntu-latest

steps:
- task: AzureResourceManagerTemplateDeployment@3
  inputs:
    deploymentScope: 'Resource Group'
    azureResourceManagerConnection: 'ARMPipeline-conn'
    subscriptionId: '2f166014-0366-48ed-a256-9a901627333a'
    action: 'Create Or Update Resource Group'
    resourceGroupName: 'testRG-westus2'
    location: 'UK South'
    templateLocation: 'URL of the file'
    csmFileLink: 'https://raw.githubusercontent.com/ggg222999/azure_devops/refs/heads/main/create_web_app/azuredeploy.json'
    overrideParameters: '-projectName devpro'
    deploymentMode: 'Incremental'
    deploymentName: '1st-devops-deploy'
